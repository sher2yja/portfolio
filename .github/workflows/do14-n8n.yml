name: do14-n8n

on:
  push:
    branches: [main]
    paths:
      - 'devops_projects/n8n-k3s-local/**'
      - '.github/workflows/do14-n8n.yml'
  workflow_dispatch:
    inputs:
      target:
        description: 'Куда развёртывать'
        required: true
        type: choice
        options: [staging, production]

concurrency:
  group: do14-github
  cancel-in-progress: false

permissions:
  contents: read

defaults:
  run:
    shell: bash

env:
  PROJECT: devops_projects/n8n-k3s-local/src
  REGISTRY: ghcr.io/${{ github.repository_owner }}/do14-n8n

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    outputs:
      registry: ${{ steps.meta.outputs.registry }}
      tag: ${{ steps.meta.outputs.tag }}
    steps:
      - uses: actions/checkout@v4
      - name: Compute image coordinates
        id: meta
        run: |
          echo "registry=${REGISTRY,,}" >> "$GITHUB_OUTPUT"
          echo "tag=$GITHUB_SHA" >> "$GITHUB_OUTPUT"
      - name: Build and publish all four roles
        env:
          REGISTRY: ${{ steps.meta.outputs.registry }}
          IMAGE_TAG: ${{ steps.meta.outputs.tag }}
          REGISTRY_USER: ${{ github.actor }}
          REGISTRY_PASSWORD: ${{ secrets.GITHUB_TOKEN }}
        run: bash "$PROJECT/ci/build.sh"

  validate:
    needs: build
    runs-on: ubuntu-latest
    strategy:
      matrix:
        role: [main, webhook, worker, runner]
    permissions:
      contents: read
      packages: read
    steps:
      - uses: actions/checkout@v4
      - uses: azure/setup-helm@v4
        with:
          version: v3.21.3
      - name: Установить kubeconform
        run: |
          curl -fsSL -o /tmp/kubeconform.tar.gz https://github.com/yannh/kubeconform/releases/download/v0.6.7/kubeconform-linux-amd64.tar.gz
          tar -xzf /tmp/kubeconform.tar.gz -C /tmp kubeconform
      - name: Проверить Helm-чарт и схемы Kubernetes для обоих окружений
        run: |
          for values in staging production; do
            namespace=do14-helm
            [[ "$values" != production ]] || namespace=do14-production
            helm lint "$PROJECT/chart" --set existingSecret=n8n-secrets -f "$PROJECT/chart/values-$values.yaml"
            helm template do14 "$PROJECT/chart" -n "$namespace" --set existingSecret=n8n-secrets -f "$PROJECT/chart/values-$values.yaml" > "/tmp/do14-$values.yaml"
            /tmp/kubeconform -strict -summary -kubernetes-version 1.30.0 "/tmp/do14-$values.yaml"
          done
          helm lint "$PROJECT/chart" --set existingSecret=test-secrets --set service.type=ClusterIP -f "$PROJECT/chart/values-staging.yaml"
          helm template do14-test-schema "$PROJECT/chart" -n do14-helm --set existingSecret=test-secrets --set service.type=ClusterIP -f "$PROJECT/chart/values-staging.yaml" > /tmp/do14-candidate.yaml
          /tmp/kubeconform -strict -summary -kubernetes-version 1.30.0 /tmp/do14-candidate.yaml
      - name: Проверить, что сломанный чарт останавливается до деплоя
        run: |
          cp -a "$PROJECT/chart" /tmp/do14-broken-chart
          printf '\n---\napiVersion: apps/v1\nkind: Deployment\nmetadata:\n  name: deliberately-invalid\nspec:\n  replicas: invalid\n' >> /tmp/do14-broken-chart/templates/broken.yaml
          helm template do14 /tmp/do14-broken-chart -n do14-staging --set existingSecret=n8n-secrets -f "$PROJECT/chart/values-staging.yaml" > /tmp/do14-broken.yaml
          if /tmp/kubeconform -strict -summary -kubernetes-version 1.30.0 /tmp/do14-broken.yaml > /tmp/do14-broken-result.log 2>&1; then
            echo '::error::Сломанный чарт прошёл проверку схем'
            exit 1
          fi
          cat /tmp/do14-broken-result.log
          grep -Eq 'Invalid: [1-9]' /tmp/do14-broken-result.log
      - name: Найти секреты в коде
        uses: aquasecurity/trivy-action@0.35.0
        with:
          scan-type: fs
          scan-ref: ${{ env.PROJECT }}
          scanners: secret
          exit-code: '1'
      - name: Сканировать собранный образ
        uses: aquasecurity/trivy-action@0.35.0
        env:
          TRIVY_USERNAME: ${{ github.actor }}
          TRIVY_PASSWORD: ${{ secrets.GITHUB_TOKEN }}
        with:
          image-ref: ${{ needs.build.outputs.registry }}/${{ matrix.role }}:${{ needs.build.outputs.tag }}
          scanners: vuln
          severity: HIGH,CRITICAL
          format: json
          output: trivy-image.json
          exit-code: '0'
      - name: Опубликовать результат и остановиться при критических находках
        run: |
          jq -r '[.Results[]?.Vulnerabilities[]?] | group_by(.Severity)[] | "\(.[0].Severity): \(length)"' trivy-image.json >> "$GITHUB_STEP_SUMMARY"
          accepted=$(jq '[.Results[]?.Vulnerabilities[]? | select(.Severity == "CRITICAL" and .VulnerabilityID == "CVE-2026-60002" and (.PkgName | startswith("openssh")))] | length' trivy-image.json)
          critical=$(jq --arg role '${{ matrix.role }}' '[.Results[]?.Vulnerabilities[]? | select(.Severity == "CRITICAL" and ((.VulnerabilityID == "CVE-2026-60002" and (.PkgName | startswith("openssh")) and $role != "runner") | not))] | length' trivy-image.json)
          echo "Принятое исключение CVE-2026-60002 (OpenSSH-клиент удалён): $accepted" >> "$GITHUB_STEP_SUMMARY"
          if (( critical > 0 )); then
            echo "::error::В образе $critical критических находок; см. отчёт Trivy"
            exit 1
          fi
      - name: Сохранить отчёт сканирования
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: do14-image-scan-${{ matrix.role }}
          path: trivy-image.json
          if-no-files-found: ignore

  test:
    needs: [build, validate]
    runs-on: [self-hosted, linux, x64, do14-deploy]
    env:
      TEST_RELEASE: do14-test-${{ github.run_id }}-${{ github.run_attempt }}
    permissions:
      contents: read
      packages: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22.23.3'
      - run: npm install --global newman@6.2.1
      - name: Test isolated candidate in portfolio cluster
        id: candidate
        env:
          REGISTRY: ${{ needs.build.outputs.registry }}
          IMAGE_TAG: ${{ needs.build.outputs.tag }}
          REGISTRY_USER: ${{ github.actor }}
          REGISTRY_PASSWORD: ${{ secrets.GITHUB_TOKEN }}
        run: bash "$PROJECT/ci/test-candidate.sh"
      - name: Finish candidate cleanup after cancellation or failure
        if: ${{ always() && steps.candidate.outcome != 'skipped' }}
        run: bash "$PROJECT/ci/test-candidate.sh" --cleanup-only
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: do14-candidate
          path: ${{ env.PROJECT }}/artifacts/
          if-no-files-found: ignore

  staging:
    needs: [build, test]
    if: github.ref == 'refs/heads/main'
    runs-on: [self-hosted, linux, x64, do14-deploy]
    environment: do14-staging
    concurrency:
      group: do14-github-staging
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22.23.3'
      - name: Deploy tested SHA to portfolio staging
        env:
          REGISTRY: ${{ needs.build.outputs.registry }}
          IMAGE_TAG: ${{ needs.build.outputs.tag }}
          N8N_ENCRYPTION_KEY: ${{ secrets.N8N_ENCRYPTION_KEY }}
          N8N_RUNNERS_AUTH_TOKEN: ${{ secrets.N8N_RUNNERS_AUTH_TOKEN }}
          POSTGRES_PASSWORD: ${{ secrets.POSTGRES_PASSWORD }}
          PULL_USER: ${{ secrets.PULL_USER }}
          PULL_TOKEN: ${{ secrets.PULL_TOKEN }}
        run: bash "$PROJECT/ci/deploy.sh" staging

  production:
    needs: [build, test, staging]
    if: github.ref == 'refs/heads/main' && github.event_name == 'workflow_dispatch' && inputs.target == 'production'
    runs-on: [self-hosted, linux, x64, do14-deploy]
    environment: do14-production
    concurrency:
      group: do14-github-production
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22.23.3'
      - name: Deploy tested SHA to portfolio production
        env:
          REGISTRY: ${{ needs.build.outputs.registry }}
          IMAGE_TAG: ${{ needs.build.outputs.tag }}
          N8N_ENCRYPTION_KEY: ${{ secrets.N8N_ENCRYPTION_KEY }}
          N8N_RUNNERS_AUTH_TOKEN: ${{ secrets.N8N_RUNNERS_AUTH_TOKEN }}
          POSTGRES_PASSWORD: ${{ secrets.POSTGRES_PASSWORD }}
          PULL_USER: ${{ secrets.PULL_USER }}
          PULL_TOKEN: ${{ secrets.PULL_TOKEN }}
        run: bash "$PROJECT/ci/deploy.sh" production
