name: do14-n8n

on:
  push:
    branches: [main]
    paths:
      - 'devops_projects/n8n-k3s-local/**'
      - '.github/workflows/do14-n8n.yml'
  workflow_dispatch:
    inputs:
      target:
        description: 'Куда развёртывать'
        required: true
        type: choice
        options: [staging, production]

permissions:
  contents: read

defaults:
  run:
    shell: bash

env:
  PROJECT: devops_projects/n8n-k3s-local
  IMAGE: ghcr.io/${{ github.repository_owner }}/do14-n8n

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    outputs:
      image: ${{ steps.meta.outputs.image }}
    steps:
      - uses: actions/checkout@v4
      - name: Вычислить неизменяемый тег
        id: meta
        run: echo "image=${IMAGE,,}:$GITHUB_SHA" >> "$GITHUB_OUTPUT"
      - name: Собрать образ
        run: docker build -t "${{ steps.meta.outputs.image }}" "$PROJECT"
      - name: Опубликовать образ в GHCR
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          echo "$GH_TOKEN" | docker login ghcr.io -u "$GITHUB_ACTOR" --password-stdin
          docker push "${{ steps.meta.outputs.image }}"

  test:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: read
    steps:
      - uses: actions/checkout@v4
      - uses: azure/setup-helm@v4
        with:
          version: v3.21.3
      - name: Установить kubeconform
        run: |
          curl -fsSL -o /tmp/kubeconform.tar.gz https://github.com/yannh/kubeconform/releases/download/v0.6.7/kubeconform-linux-amd64.tar.gz
          tar -xzf /tmp/kubeconform.tar.gz -C /tmp kubeconform
      - name: Проверить Helm-чарт и схемы Kubernetes для обоих окружений
        run: |
          for values in staging production; do
            helm lint "$PROJECT/chart" --set existingSecret=n8n-secrets -f "$PROJECT/chart/values-$values.yaml"
            helm template do14 "$PROJECT/chart" -n "do14-$values" --set existingSecret=n8n-secrets -f "$PROJECT/chart/values-$values.yaml" > "/tmp/do14-$values.yaml"
            /tmp/kubeconform -strict -summary -kubernetes-version 1.30.0 "/tmp/do14-$values.yaml"
          done
      - name: Проверить, что сломанный чарт останавливается до деплоя
        run: |
          cp -a "$PROJECT/chart" /tmp/do14-broken-chart
          printf '\n---\napiVersion: apps/v1\nkind: Deployment\nmetadata:\n  name: deliberately-invalid\nspec:\n  replicas: invalid\n' >> /tmp/do14-broken-chart/templates/broken.yaml
          helm template do14 /tmp/do14-broken-chart -n do14-staging --set existingSecret=n8n-secrets -f "$PROJECT/chart/values-staging.yaml" > /tmp/do14-broken.yaml
          if /tmp/kubeconform -strict -summary -kubernetes-version 1.30.0 /tmp/do14-broken.yaml > /tmp/do14-broken-result.log 2>&1; then
            echo '::error::Сломанный чарт прошёл проверку схем'
            exit 1
          fi
          cat /tmp/do14-broken-result.log
          grep -Eq 'Invalid: [1-9]' /tmp/do14-broken-result.log
      - name: Найти секреты в коде
        uses: aquasecurity/trivy-action@0.35.0
        with:
          scan-type: fs
          scan-ref: ${{ env.PROJECT }}
          scanners: secret
          exit-code: '1'
      - name: Сканировать собранный образ
        uses: aquasecurity/trivy-action@0.35.0
        env:
          TRIVY_USERNAME: ${{ github.actor }}
          TRIVY_PASSWORD: ${{ secrets.GITHUB_TOKEN }}
        with:
          image-ref: ${{ needs.build.outputs.image }}
          scanners: vuln
          severity: HIGH,CRITICAL
          exit-code: '1'

  staging:
    needs: [build, test]
    if: github.ref == 'refs/heads/main' && (github.event_name == 'push' || inputs.target == 'staging')
    runs-on: [self-hosted, linux, x64, do14-deploy]
    environment: do14-staging
    steps:
      - uses: actions/checkout@v4
      - name: Развернуть staging
        env:
          DEPLOY_IMAGE: ${{ needs.build.outputs.image }}
        run: |
          helm upgrade --install do14 "$PROJECT/chart" \
            --namespace do14-helm -f "$PROJECT/chart/values-staging.yaml" \
            --set existingSecret=n8n-secrets \
            --set-string n8n.image="${DEPLOY_IMAGE%:*}" \
            --set-string n8n.imageTag="${DEPLOY_IMAGE##*:}" \
            --atomic --wait --timeout 10m
          kubectl -n do14-helm rollout status deployment/do14-main --timeout=120s

  production:
    needs: [build, test]
    if: github.ref == 'refs/heads/main' && github.event_name == 'workflow_dispatch' && inputs.target == 'production'
    runs-on: [self-hosted, linux, x64, do14-deploy]
    environment: do14-production
    steps:
      - uses: actions/checkout@v4
      - name: Развернуть production
        env:
          DEPLOY_IMAGE: ${{ needs.build.outputs.image }}
        run: |
          helm upgrade --install do14 "$PROJECT/chart" \
            --namespace do14-production -f "$PROJECT/chart/values-production.yaml" \
            --set existingSecret=n8n-secrets \
            --set-string n8n.image="${DEPLOY_IMAGE%:*}" \
            --set-string n8n.imageTag="${DEPLOY_IMAGE##*:}" \
            --atomic --wait --timeout 10m
          kubectl -n do14-production rollout status deployment/do14-main --timeout=120s
