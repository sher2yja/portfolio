apiVersion: v1
kind: ServiceAccount
metadata:
  name: do14-deployer
  namespace: do14-helm
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: do14-deployer
  namespace: do14-helm
rules:
  - apiGroups: [""]
    resources: [configmaps, secrets, services, persistentvolumeclaims, pods]
    verbs: [get, list, watch, create, update, patch, delete]
  - apiGroups: [apps]
    resources: [deployments, statefulsets]
    verbs: [get, list, watch, create, update, patch, delete]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: do14-deployer
  namespace: do14-helm
subjects:
  - kind: ServiceAccount
    name: do14-deployer
    namespace: do14-helm
roleRef:
  kind: Role
  name: do14-deployer
  apiGroup: rbac.authorization.k8s.io
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: do14-deployer
  namespace: do14-production
rules:
  - apiGroups: [""]
    resources: [configmaps, secrets, services, persistentvolumeclaims, pods]
    verbs: [get, list, watch, create, update, patch, delete]
  - apiGroups: [apps]
    resources: [deployments, statefulsets]
    verbs: [get, list, watch, create, update, patch, delete]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: do14-deployer
  namespace: do14-production
subjects:
  - kind: ServiceAccount
    name: do14-deployer
    namespace: do14-helm
roleRef:
  kind: Role
  name: do14-deployer
  apiGroup: rbac.authorization.k8s.io
