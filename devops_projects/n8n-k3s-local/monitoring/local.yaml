apiVersion: v1
kind: Namespace
metadata:
  name: do14-monitoring
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: prometheus-config
  namespace: do14-monitoring
data:
  prometheus.yml: |
    global:
      scrape_interval: 15s
      evaluation_interval: 15s
    rule_files:
      - /etc/prometheus/rules.yml
    scrape_configs:
      - job_name: n8n-main
        static_configs:
          - targets: [do14-main.do14-helm.svc.cluster.local:5678]
      - job_name: n8n-webhook
        static_configs:
          - targets: [do14-webhook.do14-helm.svc.cluster.local:5678]
      - job_name: postgres
        static_configs:
          - targets: [postgres-exporter.do14-helm.svc.cluster.local:9187]
      - job_name: postgres-production
        static_configs:
          - targets: [postgres-exporter.do14-production.svc.cluster.local:9187]
      - job_name: node
        static_configs:
          - targets: [node-exporter.do14-monitoring.svc.cluster.local:9100]
      - job_name: pod-state-staging
        static_configs:
          - targets: [do14-cluster-summary.do14-helm.svc.cluster.local:8080]
      - job_name: pod-state-production
        static_configs:
          - targets: [do14-cluster-summary.do14-production.svc.cluster.local:8080]
  rules.yml: |
    groups:
      - name: do14-n8n
        rules:
          - alert: N8nMainUnavailable
            expr: up{job="n8n-main"} == 0
            for: 1m
            labels: {severity: critical}
            annotations:
              summary: "n8n main недоступен"
          - alert: N8nWebhookUnavailable
            expr: up{job="n8n-webhook"} == 0
            for: 1m
            labels: {severity: critical}
            annotations:
              summary: "n8n webhook недоступен"
          - alert: N8nQueueBacklog
            expr: n8n_scaling_mode_queue_jobs_waiting > 5
            for: 2m
            labels: {severity: warning}
            annotations:
              summary: "В очереди n8n более пяти заданий"
          - alert: N8nExecutionFailures
            expr: increase(n8n_scaling_mode_queue_jobs_failed[5m]) > 0
            labels: {severity: warning}
            annotations:
              summary: "В n8n появились неуспешные исполнения"
          - alert: PostgresUnavailable
            expr: up{job=~"postgres.*"} == 0 or pg_up{job=~"postgres.*"} == 0
            for: 1m
            labels: {severity: critical}
            annotations:
              summary: "PostgreSQL недоступен"
          - alert: PostgresDatabaseGrowing
            expr: pg_database_size_bytes{datname="n8n"} - min_over_time(pg_database_size_bytes{datname="n8n"}[1h]) > 25 * 1024 * 1024
            for: 5m
            labels: {severity: warning}
            annotations:
              summary: "База n8n выросла более чем на 25 МБ за час"
          - alert: NodeDiskNearlyFull
            expr: node_filesystem_avail_bytes{job="node",mountpoint="/"} / node_filesystem_size_bytes{job="node",mountpoint="/"} < 0.1
            for: 5m
            labels: {severity: warning}
            annotations:
              summary: "На диске VM кластера осталось менее 10%"
          - alert: PodStateMetricsUnavailable
            expr: up{job=~"pod-state.*"} == 0
            for: 1m
            labels: {severity: warning}
            annotations:
              summary: "Метрики состояния Pod недоступны"
---
apiVersion: apps/v1
kind: DaemonSet
metadata:
  name: node-exporter
  namespace: do14-monitoring
spec:
  selector:
    matchLabels: {app: do14-node-exporter}
  template:
    metadata:
      labels: {app: do14-node-exporter}
    spec:
      containers:
        - name: node-exporter
          image: quay.io/prometheus/node-exporter:v1.10.2
          args: [--path.rootfs=/host]
          ports:
            - {containerPort: 9100}
          resources:
            requests: {cpu: 10m, memory: 32Mi}
            limits: {memory: 128Mi}
          volumeMounts:
            - {name: host-root, mountPath: /host, readOnly: true}
      volumes:
        - name: host-root
          hostPath: {path: /, type: Directory}
---
apiVersion: v1
kind: Service
metadata:
  name: node-exporter
  namespace: do14-monitoring
spec:
  selector: {app: do14-node-exporter}
  ports:
    - {port: 9100, targetPort: 9100}
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: postgres-exporter
  namespace: do14-helm
spec:
  replicas: 1
  selector:
    matchLabels: {app: do14-postgres-exporter}
  template:
    metadata:
      labels: {app: do14-postgres-exporter}
    spec:
      containers:
        - name: postgres-exporter
          image: quay.io/prometheuscommunity/postgres-exporter:v0.20.1
          env:
            - {name: DATA_SOURCE_URI, value: "do14-postgres:5432/n8n?sslmode=disable"}
            - {name: DATA_SOURCE_USER, value: n8n}
            - name: DATA_SOURCE_PASS
              valueFrom:
                secretKeyRef: {name: n8n-secrets, key: POSTGRES_PASSWORD}
          ports:
            - {containerPort: 9187}
          resources:
            requests: {cpu: 10m, memory: 32Mi}
            limits: {memory: 128Mi}
---
apiVersion: v1
kind: Service
metadata:
  name: postgres-exporter
  namespace: do14-helm
spec:
  selector: {app: do14-postgres-exporter}
  ports:
    - {port: 9187, targetPort: 9187}
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: postgres-exporter
  namespace: do14-production
spec:
  replicas: 1
  selector:
    matchLabels: {app: do14-postgres-exporter}
  template:
    metadata:
      labels: {app: do14-postgres-exporter}
    spec:
      containers:
        - name: postgres-exporter
          image: quay.io/prometheuscommunity/postgres-exporter:v0.20.1
          env:
            - {name: DATA_SOURCE_URI, value: "do14-postgres:5432/n8n?sslmode=disable"}
            - {name: DATA_SOURCE_USER, value: n8n}
            - name: DATA_SOURCE_PASS
              valueFrom:
                secretKeyRef: {name: n8n-secrets, key: POSTGRES_PASSWORD}
          ports:
            - {containerPort: 9187}
          resources:
            requests: {cpu: 10m, memory: 32Mi}
            limits: {memory: 128Mi}
---
apiVersion: v1
kind: Service
metadata:
  name: postgres-exporter
  namespace: do14-production
spec:
  selector: {app: do14-postgres-exporter}
  ports:
    - {port: 9187, targetPort: 9187}
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: prometheus
  namespace: do14-monitoring
spec:
  replicas: 1
  strategy: {type: Recreate}
  selector:
    matchLabels: {app: do14-prometheus}
  template:
    metadata:
      labels: {app: do14-prometheus}
    spec:
      containers:
        - name: prometheus
          image: prom/prometheus:v3.5.0
          args:
            - --config.file=/etc/prometheus/prometheus.yml
            - --storage.tsdb.retention.time=2d
          ports:
            - containerPort: 9090
          resources:
            requests: {cpu: 50m, memory: 128Mi}
            limits: {memory: 384Mi}
          volumeMounts:
            - {name: config, mountPath: /etc/prometheus}
            - {name: data, mountPath: /prometheus}
      volumes:
        - name: config
          configMap: {name: prometheus-config}
        - name: data
          persistentVolumeClaim: {claimName: prometheus-data}
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: prometheus-data
  namespace: do14-monitoring
spec:
  accessModes: [ReadWriteOnce]
  storageClassName: local-path
  resources:
    requests: {storage: 1Gi}
---
apiVersion: v1
kind: Service
metadata:
  name: prometheus
  namespace: do14-monitoring
spec:
  selector: {app: do14-prometheus}
  ports:
    - {port: 9090, targetPort: 9090}
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: grafana-provisioning
  namespace: do14-monitoring
data:
  datasource.yaml: |
    apiVersion: 1
    datasources:
      - name: Prometheus
        type: prometheus
        access: proxy
        url: http://prometheus.do14-monitoring.svc.cluster.local:9090
        isDefault: true
  dashboards.yaml: |
    apiVersion: 1
    providers:
      - name: DO14
        type: file
        options:
          path: /var/lib/grafana/dashboards
  queue.json: |
    {
      "title": "DO14 — n8n queue",
      "uid": "do14-queue",
      "schemaVersion": 41,
      "version": 1,
      "refresh": "15s",
      "time": {"from": "now-1h", "to": "now"},
      "panels": [
        {"id": 1, "type": "timeseries", "title": "Waiting and active jobs", "gridPos": {"x": 0, "y": 0, "w": 12, "h": 8}, "targets": [{"expr": "n8n_scaling_mode_queue_jobs_waiting", "legendFormat": "waiting"}, {"expr": "n8n_scaling_mode_queue_jobs_active", "legendFormat": "active"}]},
        {"id": 2, "type": "timeseries", "title": "Completed and failed jobs", "gridPos": {"x": 12, "y": 0, "w": 12, "h": 8}, "targets": [{"expr": "rate(n8n_scaling_mode_queue_jobs_completed[5m])", "legendFormat": "completed/s"}, {"expr": "rate(n8n_scaling_mode_queue_jobs_failed[5m])", "legendFormat": "failed/s"}]},
        {"id": 3, "type": "stat", "title": "PostgreSQL available", "gridPos": {"x": 0, "y": 8, "w": 6, "h": 4}, "targets": [{"expr": "pg_up{job=~\"postgres.*\"}", "legendFormat": "{{job}}"}]},
        {"id": 4, "type": "timeseries", "title": "n8n database size", "gridPos": {"x": 6, "y": 8, "w": 18, "h": 8}, "fieldConfig": {"defaults": {"unit": "bytes"}}, "targets": [{"expr": "pg_database_size_bytes{datname=\"n8n\"}", "legendFormat": "{{job}}"}]},
        {"id": 5, "type": "stat", "title": "Cluster VM disk available", "gridPos": {"x": 0, "y": 16, "w": 6, "h": 4}, "fieldConfig": {"defaults": {"unit": "percentunit"}}, "targets": [{"expr": "node_filesystem_avail_bytes{job=\"node\",mountpoint=\"/\"} / node_filesystem_size_bytes{job=\"node\",mountpoint=\"/\"}"}]},
        {"id": 6, "type": "timeseries", "title": "Webhook execution p95", "gridPos": {"x": 6, "y": 16, "w": 9, "h": 8}, "fieldConfig": {"defaults": {"unit": "s"}}, "targets": [{"expr": "histogram_quantile(0.95, sum by (le) (rate(n8n_workflow_execution_duration_seconds_bucket{job=\"n8n-webhook\"}[1h])))"}]},
        {"id": 7, "type": "stat", "title": "Queue job failure share (1h)", "gridPos": {"x": 15, "y": 16, "w": 9, "h": 4}, "fieldConfig": {"defaults": {"unit": "percentunit"}}, "targets": [{"expr": "sum(increase(n8n_scaling_mode_queue_jobs_failed{job=\"n8n-main\"}[1h])) / clamp_min(sum(increase(n8n_scaling_mode_queue_jobs_completed{job=\"n8n-main\"}[1h])) + sum(increase(n8n_scaling_mode_queue_jobs_failed{job=\"n8n-main\"}[1h])), 1)"}]}
      ]
    }
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: grafana
  namespace: do14-monitoring
spec:
  replicas: 1
  selector:
    matchLabels: {app: do14-grafana}
  template:
    metadata:
      labels: {app: do14-grafana}
    spec:
      containers:
        - name: grafana
          image: grafana/grafana:12.1.1
          env:
            - {name: GF_AUTH_ANONYMOUS_ENABLED, value: "true"}
            - {name: GF_AUTH_ANONYMOUS_ORG_ROLE, value: Viewer}
            - {name: GF_AUTH_DISABLE_LOGIN_FORM, value: "true"}
          ports:
            - containerPort: 3000
          resources:
            requests: {cpu: 50m, memory: 128Mi}
            limits: {memory: 384Mi}
          volumeMounts:
            - {name: provisioning, mountPath: /etc/grafana/provisioning/datasources/datasource.yaml, subPath: datasource.yaml}
            - {name: provisioning, mountPath: /etc/grafana/provisioning/dashboards/dashboards.yaml, subPath: dashboards.yaml}
            - {name: provisioning, mountPath: /var/lib/grafana/dashboards/queue.json, subPath: queue.json}
      volumes:
        - name: provisioning
          configMap: {name: grafana-provisioning}
---
apiVersion: v1
kind: Service
metadata:
  name: grafana
  namespace: do14-monitoring
spec:
  selector: {app: do14-grafana}
  ports:
    - {port: 3000, targetPort: 3000}
