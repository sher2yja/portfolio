apiVersion: v1
kind: Namespace
metadata:
  name: gitlab-runner
---
apiVersion: v1
kind: Namespace
metadata:
  name: do14-helm
---
apiVersion: v1
kind: Namespace
metadata:
  name: do14-production
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: do14-ci-job
  namespace: gitlab-runner
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: do14-ci-job
  namespace: do14-helm
rules:
  - apiGroups: [""]
    resources: [configmaps, secrets, services, persistentvolumeclaims, pods]
    verbs: [get, list, watch, create, update, patch, delete]
  - apiGroups: [""]
    resources: [pods/exec, pods/portforward]
    verbs: [get, create]
  - apiGroups: [""]
    resources: [pods/log, events]
    verbs: [get, list, watch]
  - apiGroups: [apps]
    resources: [deployments, statefulsets]
    verbs: [get, list, watch, create, update, patch, delete]
  - apiGroups: [apps]
    resources: [replicasets]
    verbs: [get, list, watch]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: do14-ci-job
  namespace: do14-helm
subjects:
  - kind: ServiceAccount
    name: do14-ci-job
    namespace: gitlab-runner
roleRef:
  kind: Role
  name: do14-ci-job
  apiGroup: rbac.authorization.k8s.io
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: do14-ci-job
  namespace: do14-production
rules:
  - apiGroups: [""]
    resources: [configmaps, secrets, services, persistentvolumeclaims, pods]
    verbs: [get, list, watch, create, update, patch, delete]
  - apiGroups: [""]
    resources: [pods/exec, pods/portforward]
    verbs: [get, create]
  - apiGroups: [""]
    resources: [pods/log, events]
    verbs: [get, list, watch]
  - apiGroups: [apps]
    resources: [deployments, statefulsets]
    verbs: [get, list, watch, create, update, patch, delete]
  - apiGroups: [apps]
    resources: [replicasets]
    verbs: [get, list, watch]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: do14-ci-job
  namespace: do14-production
subjects:
  - kind: ServiceAccount
    name: do14-ci-job
    namespace: gitlab-runner
roleRef:
  kind: Role
  name: do14-ci-job
  apiGroup: rbac.authorization.k8s.io
