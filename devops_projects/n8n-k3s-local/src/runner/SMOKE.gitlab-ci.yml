# Temporary S1 pipeline; Maxim owns the final root .gitlab-ci.yml.
stages: [build, test]
default:
  tags: [k8s]
  image: docker:24.0.5-cli
variables:
  DOCKER_HOST: tcp://docker:2376
  DOCKER_TLS_CERTDIR: /certs
  DOCKER_TLS_VERIFY: "1"
  DOCKER_CERT_PATH: /certs/client
  REGISTRY: $CI_REGISTRY_IMAGE
  IMAGE_TAG: $CI_COMMIT_SHORT_SHA
build:
  stage: build
  services:
    - name: docker:24.0.5-dind
      alias: docker
  before_script:
    - apk add --no-cache bash curl
    - export REGISTRY_USER="$CI_REGISTRY_USER" REGISTRY_PASSWORD="$CI_REGISTRY_PASSWORD"
    - for attempt in $(seq 1 60); do docker info >/dev/null 2>&1 && break; sleep 1; done
  script:
    - bash src/ci/build.sh
test:
  stage: test
  image: node:22-bookworm
  before_script:
    - apt-get update && apt-get install -y curl xz-utils openssl
    - bash src/tools/install-cli.sh
    - export REGISTRY_USER="$CI_REGISTRY_USER" REGISTRY_PASSWORD="$CI_REGISTRY_PASSWORD"
  script:
    - bash src/ci/test-candidate.sh
  artifacts:
    when: always
    paths: [src/artifacts/]
