{{- $secret := required "existingSecret должен указывать на Secret с N8N_ENCRYPTION_KEY, N8N_RUNNERS_AUTH_TOKEN и POSTGRES_PASSWORD" .Values.existingSecret -}}
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ .Release.Name }}-config
data:
  DB_TYPE: postgresdb
  DB_POSTGRESDB_HOST: {{ .Release.Name }}-postgres
  DB_POSTGRESDB_DATABASE: n8n
  DB_POSTGRESDB_USER: n8n
  EXECUTIONS_MODE: queue
  QUEUE_BULL_REDIS_HOST: {{ .Release.Name }}-redis
  N8N_RUNNERS_MODE: external
  N8N_RUNNERS_BROKER_LISTEN_ADDRESS: 0.0.0.0
  OFFLOAD_MANUAL_EXECUTIONS_TO_WORKERS: "true"
  N8N_DEFAULT_BINARY_DATA_MODE: database
  N8N_ENFORCE_SETTINGS_FILE_PERMISSIONS: "true"
  N8N_DIAGNOSTICS_ENABLED: "false"
  N8N_METRICS: "true"
  N8N_METRICS_INCLUDE_QUEUE_METRICS: "true"
  EXECUTIONS_DATA_PRUNE: "true"
  EXECUTIONS_DATA_MAX_AGE: {{ .Values.n8n.executionHistoryHours | quote }}
