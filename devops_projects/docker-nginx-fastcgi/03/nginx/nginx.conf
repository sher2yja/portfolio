# Часть 3. Конфигурация nginx для связки с FastCGI-приложением.
#
# Стенд собирается на самой машине, без контейнеров: nginx и скомпилированный
# server слушают на localhost. В части 4 та же конфигурация переезжает
# в образ без изменений.

events {
    worker_connections 1024;
}


http {
    server {
        listen 81;
        server_name localhost;

        location / {
            fastcgi_pass 127.0.0.1:8080;
        }

        location /status {
            stub_status;
        }
    }
}
