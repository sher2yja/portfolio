# Часть 4. Конфигурация nginx внутри собственного образа.
#
# Совпадает с частью 3: при переносе в контейнер её править не пришлось —
# nginx и приложение по-прежнему рядом и общаются через localhost.
# Подробные пояснения к директивам — в 05/nginx/nginx.conf.

events {
    worker_connections 1024;
}


http {
    server {
        listen 81;
        server_name localhost;

        location / {
            fastcgi_pass 127.0.0.1:8080;
        }

        location /status {
            stub_status;
        }
    }
}
