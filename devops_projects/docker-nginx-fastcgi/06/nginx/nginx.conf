# Часть 6. Конфигурация nginx для схемы из двух контейнеров.
#
# Здесь nginx уже не в одном контейнере с приложением, и это меняет три вещи:
#
#   fastcgi_pass app:81  — вместо 127.0.0.1:8080. Имя app резолвится
#                          встроенным DNS Docker в адрес соседнего контейнера
#   listen 8080          — порт, на который приходит трафик снаружи;
#                          наружу он опубликован как 80 в docker-compose.yml
#   fastcgi_params       — набор стандартных переменных FastCGI. Пока
#                          приложение и nginx были в одном контейнере,
#                          без них обходилось; при разнесении лучше передавать
#                          приложению полный контекст запроса
#
# Этот файл монтируется в готовый образ nginx:1.24.0 и в сборке не участвует.

# /etc/nginx/nginx.conf

worker_processes auto;

events {
    worker_connections 1024;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;

    server {
        listen 8080;

        location / {
            fastcgi_pass app:81;
            fastcgi_index index.fcgi;
            include /etc/nginx/fastcgi_params;
        }

        location /status {
            stub_status on;
        }
    }
}