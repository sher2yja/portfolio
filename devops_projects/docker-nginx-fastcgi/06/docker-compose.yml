# Часть 6. Разнесение на два контейнера.
#
#   app          собственный образ: FastCGI-приложение из server.c
#   nginx-proxy  готовый образ nginx, принимает трафик снаружи
#                и передаёт его app по FastCGI
#
# Запуск: docker compose up -d --build, страница на http://localhost/
#
# Наружу опубликован только порт nginx-proxy. Порт приложения не публикуется:
# внутри сети контейнеры видят друг друга по именам сервисов, а снаружи
# обращаться к приложению напрямую незачем — это и есть смысл разделения.
#
# Ключ build указывает каталог, а не файл. Dockerfile здесь назван строчными
# буквами; и docker build, и compose такое имя находят.

services:
  app:
    build: .
    networks:
      - internal-network

  nginx-proxy:
    image: nginx:1.24.0
    ports:
      - "80:8080"
    depends_on:
      - app
    networks:
      - internal-network
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf

networks:
  internal-network:
    driver: bridge