# Конфигурация nginx для закалённого образа (часть 5).
#
# Отличается от части 4 ровно одной строкой — pid. Она понадобилась
# из-за перехода на работу от непривилегированного пользователя.
#
# По умолчанию nginx пишет идентификатор процесса в /var/run/nginx.pid.
# Этот каталог принадлежит root, а пользователю sc21d05 в dockerfile
# выданы права только на /tmp, /var/cache/nginx, /var/log/nginx и /etc/nginx.
# Без переноса pid контейнер падает сразу после старта:
#
#   [emerg] open() "/var/run/nginx.pid" failed (13: Permission denied)
#
# Dockle этого не показывает: он проверяет слои образа, а не запуск.
pid /tmp/nginx.pid;

events {
    worker_connections 1024;
}

http {
    server {
        # Порт 81 внутри контейнера. Наружу он пробрасывается при docker run,
        # поэтому менять его при смене внешнего порта не требуется.
        listen 81;
        server_name localhost;

        location / {
            # Запросы уходят FastCGI-приложению, скомпилированному из server.c.
            # Адрес локальный: в этой части nginx и приложение живут в одном
            # контейнере, их связывает петлевой интерфейс. В части 6 они
            # разъезжаются по разным контейнерам, и адрес меняется на имя сервиса.
            fastcgi_pass 127.0.0.1:8080;
        }

        location /status {
            # Встроенная страница статистики nginx: активные соединения,
            # принятые и обработанные запросы. Отдельного экспортёра
            # для базовых показателей не нужно.
            stub_status;
        }
    }
}
