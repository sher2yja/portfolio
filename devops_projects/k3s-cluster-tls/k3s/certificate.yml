# Wildcard-сертификат для домена стенда.
#
# Домен вида *.192.168.56.12.nip.io обслуживает сервис nip.io: он резолвит
# имя в IP, зашитый в самом имени. Регистрация домена не требуется.
#
# cert-manager по этому объекту сам создаст секрет wildcard-tls типа
# kubernetes.io/tls — на него ссылается ingress.yml.

apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
  name: wildcard-cert
  namespace: default
spec:
  secretName: wildcard-tls
  issuerRef:
    name: selfsigned-issuer
    kind: ClusterIssuer
  commonName: "*.192.168.56.12.nip.io"
  dnsNames:
  - "*.192.168.56.12.nip.io"