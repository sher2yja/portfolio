# ВНИМАНИЕ: значения здесь — учебные заглушки локального стенда.
#
# postgres/postgres и guest/guest — пароли по умолчанию, реального доступа
# никуда не дают. UUID сервисов взяты из поставки учебного приложения.
#
# В рабочем проекте секреты в репозитории не хранят: их держат во внешнем
# хранилище (Vault, SOPS, секреты облачного провайдера) и подставляют на
# этапе деплоя. base64 в Secret — это кодирование, а не шифрование.
#
# stringData вместо data — Kubernetes сам закодирует значения в base64,
# в манифесте они остаются читаемыми.
#
# Пара RSA-ключей для подписи JWT в репозиторий не выкладывается. Перед
# запуском стенда подставить свою — команды генерации в нужном формате
# (base64 от DER, без PEM-заголовков):
#
#   openssl genpkey -algorithm RSA -pkeyopt rsa_keygen_bits:2048 -out jwt.pem
#   openssl pkcs8 -topk8 -nocrypt -in jwt.pem -outform DER | base64 -w0   # приватный
#   openssl rsa -in jwt.pem -pubout -outform DER | base64 -w0             # публичный
apiVersion: v1
kind: Secret
metadata:
  name: my-secrets
type: Opaque
stringData:
  POSTGRES_USER: postgres
  POSTGRES_PASSWORD: postgres
  RABBIT_MQ_USER: guest
  RABBIT_MQ_PASSWORD: guest

  GATEWAY_SERVICE_UUID: b51ceda2-bfa5-11eb-8529-0242ac130003
  BOOKING_SERVICE_UUID: 911ccb4c-c055-11eb-8529-0242ac130003

  PRIVAT_KEY: "<приватный ключ: base64 от DER, см. шапку файла>"
  PUBLIC_KEY: "<публичный ключ: base64 от DER, см. шапку файла>"
