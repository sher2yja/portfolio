apiVersion: v2
name: myapp
description: >-
  Система бронирования отелей: семь микросервисов Spring Boot, PostgreSQL
  и RabbitMQ. Чарт разворачивает приложение целиком — Deployment и Service
  на каждый компонент, общий ConfigMap с переменными окружения, Secret
  с учётными данными и ключами подписи JWT, том под данные PostgreSQL
  и Ingress, разводящий запросы по двум точкам входа.
type: application

# Версия самого чарта. Поднимается при изменении шаблонов и проверяется
# джобой staging: тег helm-cd-v<X> обязан совпасть с этим полем.
version: 0.4.1

# Версия приложения, которое разворачивается. Совпадает с imageTag в values.
appVersion: "1.1.0"

# Мониторинг вынесен в подчарт, а не рассыпан по шаблонам приложения.
# Причина простая: у него собственный жизненный цикл только на словах —
# наблюдать без приложения нечего, поэтому релиз должен быть общим, — но
# состав объектов совершенно другой, и держать их вперемешку значит каждый
# раз разбираться, к чему относится очередной ConfigMap.
#
# condition делает его выключаемым одним ключом, без правки шаблонов:
#   --set monitoring.enabled=true
#
# repository не указан намеренно: чарт лежит физически в charts/monitoring,
# и больше Helm ничего не требует. Команду `helm dependency update` для него
# запускать НЕЛЬЗЯ — она попытается разрешить зависимость через репозиторий
# и снесёт распакованный каталог.
dependencies:
  - name: monitoring
    version: 0.1.0
    condition: monitoring.enabled
