# Оверрайд под одноразовый кластер k3d, который поднимается прямо в раннере
# GitHub Actions. Применяется как:
#   helm upgrade --install myapp <chart> -f values-ci.yaml ...
#
# Раннер ubuntu-latest на публичном репозитории — 4 vCPU и 16 ГБ памяти.
# Память здесь не узкое место (весь стенд укладывается примерно в 3 ГБ),
# узкое место — процессор: семь JVM Spring Boot стартуют одновременно.

# Диск в одноразовом кластере живёт минуты — двух гигабайт под него не нужно.
persistentVolumeClaims:
  - name: postgres-pvc
    size: 1Gi
    accessModes:
      - ReadWriteOnce

# Запросы по CPU занижены сознательно. Суммарно девять подов по 100m дали бы
# 900m из четырёх ядер, и планировщик разложил бы их без запаса под ingress,
# coredns и metrics-server. 50m оставляет ему воздух, а лимит не трогаем —
# он ограничивает пик, а не размещение.
defaultResources:
  requests:
    cpu: 50m
    memory: 256Mi
  limits:
    cpu: 800m
    memory: 384Mi

env:
  # -XX:TieredStopAtLevel=1 отключает компилятор C2 и оставляет только C1.
  # Пиковая производительность падает, но она здесь не нужна: тест гоняет
  # пять запросов. Зато старт Spring Boot сокращается заметно — на общем
  # раннере это разница между "уложились в таймаут" и "не уложились".
  #
  # -noverify использовать нельзя: опция удалена в Java 13, а шесть образов
  # из семи работают на 17.
  JAVA_TOOL_OPTIONS: "-Xmx192m -Xss512k -XX:MaxMetaspaceSize=128m -XX:TieredStopAtLevel=1"
