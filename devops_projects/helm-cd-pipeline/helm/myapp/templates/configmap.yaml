apiVersion: v1
kind: ConfigMap
metadata:
  name: environments
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "myapp.labels" . | nindent 4 }}
data:
  {{- range $key, $value := .Values.env }}
  # quote обязателен: в ConfigMap значения только строковые, а без кавычек
  # "8081" и create ушли бы в YAML числом и булевым-подобным скаляром.
  {{ $key }}: {{ $value | quote }}
  {{- end }}
