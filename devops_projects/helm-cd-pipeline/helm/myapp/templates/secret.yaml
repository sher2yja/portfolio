{{/*
Secret с учётными данными баз, брокера и парой ключей для подписи JWT.

Ключи перечислены явно, а не собраны range'ом по map, ради required: если
значение не передано, установка падает сразу и с внятным текстом. Раньше
секрет заводился отдельной командой до helm install, и забытый шаг выглядел
так: девять подов уходят в CrashLoopBackOff, helm --wait ждёт до таймаута,
а настоящая причина ("secret svc-secrets not found") видна только в
kubectl describe. Одна строка required заменяет весь этот путь.

trim обязателен: --set-file затягивает файл вместе с завершающим переводом
строки, а Base64.decode в JwtProvider на нём падает.

secret.create: false оставляет путь "секрет заведён снаружи" — для тех, кто
управляет секретами через SealedSecrets или внешний оператор.
*/}}
{{- if .Values.secret.create }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ .Values.secret.name }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "myapp.labels" . | nindent 4 }}
type: Opaque
stringData:
  POSTGRES_USER: {{ .Values.secret.data.POSTGRES_USER | quote }}
  POSTGRES_PASSWORD: {{ required "secret.data.POSTGRES_PASSWORD не задан — передайте --set-string или -f" .Values.secret.data.POSTGRES_PASSWORD | quote }}
  RABBIT_MQ_USER: {{ .Values.secret.data.RABBIT_MQ_USER | quote }}
  RABBIT_MQ_PASSWORD: {{ required "secret.data.RABBIT_MQ_PASSWORD не задан — передайте --set-string или -f" .Values.secret.data.RABBIT_MQ_PASSWORD | quote }}
  PRIVATE_KEY: {{ required "secret.data.PRIVATE_KEY не задан — нужен PKCS#8 DER в base64 одной строкой, см. infra/secrets.env.example" .Values.secret.data.PRIVATE_KEY | trim | quote }}
  PUBLIC_KEY: {{ required "secret.data.PUBLIC_KEY не задан — нужен X.509 DER в base64 одной строкой, см. infra/secrets.env.example" .Values.secret.data.PUBLIC_KEY | trim | quote }}
{{- end }}
