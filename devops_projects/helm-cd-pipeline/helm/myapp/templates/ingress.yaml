{{/*
Ingress разводит по путям два сервиса, стоящие за одним адресом.

Зачем он нужен: коллекция Postman обращается к
{{ "{{API_HOST}}" }}:{{ "{{USERS_PORT}}" }} и {{ "{{API_HOST}}" }}:{{ "{{GATEWAY_PORT}}" }},
то есть хост у всех запросов один, а сервиса за ним два — session-service
для /api/v1/auth и gateway-service для /api/v1/gateway.

host по умолчанию пустой: тогда правило срабатывает при любом заголовке
Host, и тестам достаточно сходить на адрес самого контроллера — не нужны
ни внешний DNS, ни правки /etc/hosts в раннере. На стенде, где приложение
открывается из браузера, host задаётся в values-local.yaml.

TLS не настраивается: внутри кластера ходим по HTTP, поэтому не нужны
ни cert-manager, ни флаг --insecure у newman.
*/}}
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: main-ingress
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "myapp.labels" . | nindent 4 }}
spec:
  ingressClassName: {{ .Values.ingress.className }}
  rules:
    - {{ with .Values.ingress.host }}host: {{ . | quote }}
      {{ end }}http:
        paths:
          {{- range .Values.ingress.paths }}
          - path: {{ .path }}
            pathType: Prefix
            backend:
              service:
                name: {{ .serviceName }}
                port:
                  number: {{ .servicePort }}
          {{- end }}
          {{- if and .Values.monitoring.enabled .Values.monitoring.grafana.enabled }}
          {{/*
          Правило для Grafana добавлено здесь, а не в подчарте, хотя по
          принадлежности место ему там. Причина в устройстве Helm: подчарт
          не видит значений родителя иначе как через global, а нужны и
          className, и host — оба заданы у приложения. Заводить global ради
          одного правила значит усложнить чарт сильнее, чем эта вложенность
          того стоит.

          Без этого правила Grafana отвечает только через port-forward,
          а через Ingress отдаёт 404 — при полностью исправном поде.
          Найдено при попытке открыть её в браузере со стенда.
          */}}
          - path: {{ .Values.monitoring.grafana.ingressPath }}
            pathType: Prefix
            backend:
              service:
                name: grafana
                port:
                  number: {{ .Values.monitoring.grafana.service.port }}
          {{- end }}
