{{- if .Values.loki.enabled }}
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "monitoring.fullname" . }}-loki
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "monitoring.labels" . | nindent 4 }}
data:
  loki-config.yml: |
{{ .Files.Get "files/loki-config.yml" | indent 4 }}
---
apiVersion: v1
kind: Service
metadata:
  name: loki
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "monitoring.labels" . | nindent 4 }}
spec:
  type: ClusterIP
  selector:
    {{- include "monitoring.selector" (dict "component" "loki" "root" $) | nindent 4 }}
  ports:
    - name: http
      port: {{ .Values.loki.service.port }}
      targetPort: 3100
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: loki
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "monitoring.labels" . | nindent 4 }}
spec:
  replicas: 1
  strategy:
    # Как и у Prometheus: каталог с чанками занимается эксклюзивно,
    # два пода одновременно на нём не уживутся.
    type: Recreate
  selector:
    matchLabels:
      {{- include "monitoring.selector" (dict "component" "loki" "root" $) | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "monitoring.labels" . | nindent 8 }}
        app.kubernetes.io/component: loki
      annotations:
        checksum/config: {{ .Files.Get "files/loki-config.yml" | sha256sum }}
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        fsGroup: 10001
      containers:
        - name: loki
          image: {{ .Values.loki.image }}
          args:
            - -config.file=/etc/loki/loki-config.yml
          ports:
            - name: http
              containerPort: 3100
          readinessProbe:
            httpGet: { path: /ready, port: 3100 }
            # Loki отвечает на /ready не сразу: сначала поднимается кольцо
            # и инициализируется хранилище. Пятнадцать секунд задержки
            # избавляют от десятка бессмысленных Warning в событиях.
            initialDelaySeconds: 15
            periodSeconds: 5
            failureThreshold: 30
          livenessProbe:
            httpGet: { path: /ready, port: 3100 }
            initialDelaySeconds: 60
            periodSeconds: 20
            failureThreshold: 5
          resources:
            {{- toYaml .Values.loki.resources | nindent 12 }}
          volumeMounts:
            - { name: config, mountPath: /etc/loki }
            - { name: data,   mountPath: /loki }
      volumes:
        - name: config
          configMap:
            name: {{ include "monitoring.fullname" . }}-loki
        - name: data
        {{- if .Values.loki.persistence.enabled }}
          persistentVolumeClaim:
            claimName: {{ include "monitoring.fullname" . }}-loki
        {{- else }}
          emptyDir: {}
        {{- end }}
{{- if .Values.loki.persistence.enabled }}
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: {{ include "monitoring.fullname" . }}-loki
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "monitoring.labels" . | nindent 4 }}
spec:
  accessModes: ["ReadWriteOnce"]
  resources:
    requests:
      storage: {{ .Values.loki.persistence.size }}
{{- end }}
{{- end }}
