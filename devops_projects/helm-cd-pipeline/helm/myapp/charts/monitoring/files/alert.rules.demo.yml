# Демонстрационное правило — единственное, которое срабатывает гарантированно.
#
# Оно существует ради одной задачи: показать, что маршрут
# Prometheus → Alertmanager → получатель собран правильно и уведомление
# доходит. Ждать для этого настоящей аварии можно бесконечно.
#
# От правил-заглушек, которыми грешит первая версия любого мониторинга,
# отличается не выражением, а честностью. Там правила вида "> 1" стояли
# вперемешку с настоящими и выглядели как настоящие. Здесь оно вынесено
# в отдельный файл, названо Demo, помечено меткой demo="true", уходит
# с severity=info и выключается одним ключом:
#
#   --set monitoring.prometheus.demoAlert.enabled=false
groups:
  - name: demo
    rules:
      - alert: DemoAlertAlwaysFiring
        expr: sum(up{job="spring-services"}) >= 1
        for: 30s
        labels:
          severity: info
          demo: "true"
        annotations:
          summary: "Демонстрационный алерт: на связи {{ $value }} инструментованных сервисов"
          description: "Правило истинно всегда и намеренно — им проверяется доставка уведомлений, а не состояние приложения."
