# Оверрайд под локальный стенд: две виртуальные машины Vagrant с k3s.
# Применяется скриптом infra/scripts/deploy-app.sh.
#
# Отличие от CI одно, но существенное: кластер живёт долго, к нему ходят
# из браузера хоста, поэтому у Ingress появляется имя. Добавьте его в
# /etc/hosts хоста, указав на адрес мастера:
#   192.168.60.10  myapp.local
ingress:
  host: myapp.local

# На стенде процессор не в дефиците, а память — да (по 2 ГБ на узел),
# поэтому запросы по CPU оставляем честными: они и раскладывают поды
# по двум узлам вместо того, чтобы сложить всё на мастер.
