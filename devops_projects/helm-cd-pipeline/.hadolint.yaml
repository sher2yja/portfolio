# Порог падения — warning: замечания уровня info (например DL3059 про
# соседние RUN) остаются видимыми в логе, но не роняют стадию сборки.
failure-threshold: warning

ignored:
  # DL3018 — «пинуйте версии в apk add».
  #
  # Правило разумное для стабильных дистрибутивов и вредное для Alpine:
  # её репозитории хранят только текущую версию пакета, поэтому
  # `apk add bash=5.2.15-r5` перестаёт собираться через несколько недель
  # после очередного обновления ветки. Воспроизводимость здесь даётся не
  # пином версии пакета, а фиксацией самого базового образа
  # (eclipse-temurin:17-jre-alpine), что и сделано.
  #
  # bash нужен потому, что wait-for-it.sh начинается с #!/usr/bin/env bash
  # и использует конструкции, которых нет в ash из busybox.
  - DL3018
