# Девять Service — по одному на каждый Deployment.
#
# Имена Service и Deployment намеренно НЕ совпадают: Deployment называется
# session-svc, а Service — session-service. Именно через имена Service сервисы
# находят друг друга по внутреннему DNS (http://hotel-service:8082 и т.п.),
# они же прописаны в ConfigMap с адресами. Переименование ради единообразия
# сломает межсервисные вызовы.
#
# Тип не указан — значит ClusterIP: наружу приложение выходит только через
# Ingress, напрямую порты нод не занимаются.
#
# Связь Service с подами идёт по метке svc, а не по имени Deployment.

# db
apiVersion: v1
kind: Service
metadata:
  name: db
  namespace: basic-kuber
spec:
  selector:
    svc: db
  ports:
  - protocol: TCP
    port: 5432
    targetPort: 5432

---

# rabbitmq
apiVersion: v1
kind: Service
metadata:
  name: rabbitmq
  namespace: basic-kuber
spec:
  selector:
    svc: rabbit
  ports:
  - name: data-exchange
    protocol: TCP
    port: 5672
    targetPort: 5672
  - name: web
    protocol: TCP
    port: 15672
    targetPort: 15672

---

