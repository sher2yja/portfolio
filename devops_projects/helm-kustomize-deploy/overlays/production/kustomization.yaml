# Оверлей production — единственное окружение проекта.
#
# База подключается как обычный ресурс (../../base), поверх неё добавляются
# конфигурация и патчи. Kustomize не шаблонизатор: он берёт готовые валидные
# манифесты и накладывает изменения, ничего не подставляя в текст.
#
# ConfigMap и Secret лежат здесь, а не в base, намеренно: в базе — то, что
# одинаково для всех окружений (сервисы и развёртывания), в оверлее — то, что
# от окружения зависит. Deployment'ы в base ссылаются на них по имени через
# envFrom, и Kustomize связывает объекты в сборке независимо от того, в каком
# слое они объявлены.
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

resources:
  - ../../base
  - configMap.yaml
  - secret.yaml

# Единственное реальное отличие сборки от сырых манифестов k3s/:
# gateway-svc получает 3 реплики вместо одной.
patches:
  - path: replicas-patch.yaml
    target:
      kind: Deployment
      name: gateway-svc
