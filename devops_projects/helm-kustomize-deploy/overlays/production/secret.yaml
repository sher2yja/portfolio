# ВНИМАНИЕ: все значения ниже — учебные заглушки, не рабочие секреты.
#
# postgres/postgres, guest/guest и пара RSA-ключей для подписи JWT существуют
# только внутри локального стенда на виртуальных машинах и никуда за его
# пределы не ведут. Хранить так секреты в настоящем проекте нельзя: они лежат
# в открытом виде в git, а base64 в Secret — это кодирование, а не шифрование.
#
# В рабочем проекте на этом месте были бы Sealed Secrets, External Secrets
# Operator или Vault, а сам файл в репозиторий не попадал бы.
#
# stringData вместо data — Kubernetes сам закодирует значения в base64,
# в манифесте они остаются читаемыми.
