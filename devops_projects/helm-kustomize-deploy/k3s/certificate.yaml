# Сырой манифест: применяется напрямую через kubectl, без Kustomize и Helm.
# Его разворачивает scripts/deploy-app.sh автоматически при каждом vagrant up.
#
# Содержимо совпадает с base/certificate.yaml — подробные пояснения там.

apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
  name: my-cert
  namespace: basic-kuber
spec:
  secretName: my-tls-keys

  duration: 2160h # Срок действия 90 дней
  renewBefore: 240h # Обновить за 10 дней до конца

  # Настройка доменных имен
  commonName: sherryja.school21 # Основное доменное имя
  dnsNames: # Все действительные доменные имена
  - sherryja.school21
  - "*.sherryja.school21"

  # Ссылка на соответствующий issue
  issuerRef:
    name: selfsigned-issuer
    kind: ClusterIssuer