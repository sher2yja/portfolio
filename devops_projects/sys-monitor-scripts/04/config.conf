# Цветовая схема для части 4.
#
# Значения — числа 1-6: 1 белый, 2 красный, 3 зелёный, 4 синий,
# 5 пурпурный, 6 чёрный.
#
# column1 — названия параметров, column2 — их значения. Фон и цвет шрифта
# в пределах одной колонки совпадать не могут: текст стал бы нечитаемым,
# и скрипт откажется работать.
#
# Файл можно удалить целиком — тогда возьмётся схема по умолчанию.

column1_background=2
column1_font_color=4
column2_background=5 
column2_font_color=1