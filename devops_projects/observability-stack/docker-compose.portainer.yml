# Portainer — веб-интерфейс к кластеру. Для задания не обязателен, но
# наглядно показывает, как Swarm разложил контейнеры по трём машинам,
# и избавляет от переключений между узлами при разборе неполадок.
#
# Устроен из двух частей: агент запускается на каждой машине и знает
# о её контейнерах, интерфейс — в одном экземпляре на менеджере.
#
# Обращение по адресу tasks.agent, а не agent, — это разные вещи. Обычное
# имя сервиса Swarm резолвит в один виртуальный адрес и балансирует между
# репликами, то есть Portainer видел бы каждый раз случайный узел. Префикс
# tasks. возвращает адреса всех экземпляров сразу — именно это и нужно,
# чтобы собрать картину по кластеру целиком.
#
# Сеть у этого стека своя, отдельная от hotel-overlay-net: с приложением
# он не взаимодействует, а работает через сокет Docker на своём узле.

version: '3.8'

services:
  portainer:
    image: portainer/portainer-ce:latest
    # --tlsskipverify: агенты используют самоподписанные сертификаты.
    command: -H tcp://tasks.agent:9001 --tlsskipverify
    ports:
      - "9000:9000"
      - "8000:8000"
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - portainer_data:/data
    networks:
      - portainer_agent
    deploy:
      mode: replicated
      replicas: 1
      placement:
        constraints:
          - node.role == manager

  agent:
    image: portainer/agent:latest
    environment:
      AGENT_CLUSTER_ADDR: tasks.agent
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - /var/lib/docker/volumes:/var/lib/docker/volumes
    networks:
      - portainer_agent
    deploy:
      mode: global
      placement:
        constraints:
          - node.platform.os == linux

networks:
  portainer_agent:
    driver: overlay
    attachable: true

volumes:
  portainer_data: