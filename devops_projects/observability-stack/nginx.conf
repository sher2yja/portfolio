# Обратный прокси перед приложением: один вход снаружи вместо публикации
# портов каждого микросервиса по отдельности.
#
# Прокси нужен ещё и потому, что Swarm распределяет реплики по узлам, а имя
# сервиса внутри оверлейной сети резолвится встроенным DNS в виртуальный
# адрес — обращаться к сервисам по именам можно только изнутри этой сети.
#
# Два порта, а не location'ы на одном: session-service и gateway-service
# ожидают запросы по корневым путям, и разведение по путям потребовало бы
# переписывать адреса в их ответах.

events {
    worker_connections 1024;
}

http {
    server {
        listen 8081;

        location / {
            proxy_pass http://session-service:8081/;
            proxy_set_header Host $proxy_host;
            proxy_set_header X-Real-IP $remote_addr;
        }
    }

    server {
        listen 8087;

        location / {
            proxy_pass http://gateway-service:8087/;
            proxy_set_header Host $proxy_host;                        
            proxy_set_header X-Real-IP $remote_addr;
        }
    }

}
