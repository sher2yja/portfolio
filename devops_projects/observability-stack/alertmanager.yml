# Конфигурация Alertmanager: куда и как уходят сработавшие правила Prometheus.
#
# ВСЕ УЧЁТНЫЕ ДАННЫЕ ЗАМЕНЕНЫ ЗАГЛУШКАМИ. В рабочем стенде здесь стояли
# действующий токен Telegram-бота, chat_id и пароль приложения почтового ящика.
# Хранить их в репозитории нельзя даже для учебного стенда: файл конфигурации
# попадает в систему контроля версий целиком, а отозвать утёкший токен можно
# только вручную через BotFather.
#
# Как заполнить перед запуском:
#   bot_token  — выдаёт @BotFather при создании бота
#   chat_id    — узнаётся запросом https://api.telegram.org/bot<TOKEN>/getUpdates
#                после того, как боту отправлено любое сообщение
#   auth_password — пароль приложения почтового ящика, не основной пароль от него
#
# Правильный способ для не-учебного окружения — не вписывать значения в файл,
# а подставлять их из переменных окружения или Docker secrets.

global:
  # Сколько ждать, прежде чем считать проблему исчезнувшей и слать «отбой».
  resolve_timeout: 2m

# Шаблон оформления сообщений. Путь — внутри контейнера: файл приезжает туда
# через configs: в docker-compose.monitoring.yml, а не через bind-mount.
templates:
  - '/etc/alertmanager/my_template.tmpl'

route:
  # Алерты с одинаковым alertname схлопываются в одно сообщение, иначе три
  # узла кластера дают три уведомления об одном и том же.
  group_by: ['alertname']
  group_wait: 10s        # пауза перед первой отправкой — успевают подтянуться соседние алерты
  group_interval: 10s    # пауза перед сообщением о новых алертах в уже существующей группе
  repeat_interval: 1h    # как часто напоминать, если проблема не ушла
  receiver: 'telegram_and_email'

receivers:
  - name: 'telegram_and_email'
    # Оба канала внутри одного receiver: Alertmanager отправит в каждый
    # из них, отдельного правила маршрутизации для этого не требуется.
    email_configs:
      - to: '<адрес получателя>'
        from: '<адрес отправителя>'
        # У каждого почтового провайдера свой SMTP-узел и порт.
        smarthost: 'smtp.yandex.ru:465'
        auth_username: '<адрес отправителя>'
        auth_password: '<пароль приложения, не пароль от ящика>'
        # Порт 465 — это SMTPS, TLS поднимается сразу при соединении.
        # STARTTLS поверх него не нужен, отсюда require_tls: false.
        require_tls: false
    telegram_configs:
      - bot_token: '<токен бота от @BotFather>'
        # Значение фиктивное. Ноль сюда поставить нельзя: Alertmanager считает
        # его отсутствующим полем и отказывается запускаться.
        chat_id: 123456789
        message: '{{ template "telegram.message" . }}'
