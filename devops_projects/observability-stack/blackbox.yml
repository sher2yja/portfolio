# Модули проверки для blackbox_exporter. Экспортёр не собирает метрики
# изнутри цели, а обращается к ней снаружи и сообщает, ответила ли она:
# именно так на дашборде считается доступность google.com.
#
# Какой модуль применить, задаёт не этот файл, а Prometheus — параметром
# module в задании blackbox_exporter в prometheus/prometheus.yml.

modules:
  http_2xx:
    prober: http
    timeout: 10s
    http:
      method: GET
      valid_http_versions: ["HTTP/1.1", "HTTP/2.0"]
      valid_status_codes: [200, 201, 202, 204, 301, 302, 304]
      preferred_ip_protocol: ip4
      no_follow_redirects: false
      tls_config:
        insecure_skip_verify: true

  icmp:
    prober: icmp
    timeout: 5s
    icmp:
      preferred_ip_protocol: ip4