# Правила оповещений. Prometheus вычисляет expr каждые evaluation_interval
# (15 с, задано в prometheus.yml) и, если условие держится дольше for,
# отправляет алерт в Alertmanager.
#
# ПОРОГИ ЗДЕСЬ — БОЕВЫЕ, из условия задания. При проверке стенда они
# временно занижались до заведомо истинных: дождаться реального падения
# свободной памяти ниже 100 Мб на трёх виртуальных машинах, которые ничего
# не делают, невозможно, а убедиться, что цепочка «правило → Alertmanager →
# шаблон → Telegram и почта» работает, было нужно. Тестовые значения
# оставлены комментарием рядом с каждым правилом.
#
# Имена алертов на русском: Prometheus не требует от них формата имени
# метрики, alertname становится обычным значением метки.

groups:
  - name: swarm_resource_alerts
    rules:
      - alert: Доступная оперативная память на узле
        # Метрика приходит от node_exporter и относится к узлу целиком,
        # а не к контейнеру: делится физическая память машины.
        expr: node_memory_MemAvailable_bytes / 1024 / 1024 < 100
        # тестовое значение: > 1 — на любой живой машине истинно всегда
        for: 30s
        annotations:
          summary: "Доступно всего {{ $value | printf \"%.2f\" }} Мб RAM"

      - alert: Затраченная контейнером RAM
        # container_memory_working_set_bytes — «рабочий набор», то есть
        # память, которую ядро не может освободить без свопа. Именно по ней
        # срабатывает OOM killer, поэтому она нагляднее общего потребления.
        # sum без by даёт суммарное потребление всех контейнеров кластера.
        expr: sum(container_memory_working_set_bytes{job="cAdvisor"}) / 1024 / 1024 / 1024 > 1
        # тестовое значение: sum(...) > 1 — сравнение сырых байт с единицей
        for: 30s
        annotations:
          summary: "Потребление памяти: {{ $value | printf \"%.2f\" }} Гб"

      - alert: Использование CPU сервисом
        # Готовой метрики «процент загрузки» нет: cAdvisor отдаёт накопленное
        # процессорное время счётчиком. rate превращает счётчик в скорость
        # роста (секунды CPU в секунду), умножение на 100 даёт проценты.
        # Группировка по имени сервиса Swarm, а не по контейнеру: у сервиса
        # с несколькими репликами нагрузка должна считаться суммарно.
        expr: sum by (container_label_com_docker_swarm_service_name) (rate(container_cpu_usage_seconds_total{container_label_com_docker_swarm_service_name!=""}[5m])) * 100 > 10
        # тестовое значение: < 100 — истинно для любого незагруженного сервиса
        for: 30s
        annotations:
          summary: "Нагрузка CPU: {{ $value | printf \"%.2f\" }}%"
