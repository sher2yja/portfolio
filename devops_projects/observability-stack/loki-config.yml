# Конфигурация Loki — хранилища логов.
#
# Loki устроен иначе, чем привычные системы поиска по логам: он не строит
# полнотекстовый индекс, а индексирует только метки (контейнер, узел, стек),
# сами же строки складывает сжатыми блоками. Поэтому он заметно экономнее
# к диску, но запрос вида «найти слово по всем логам» для него дорог —
# сначала отбираем по меткам, потом ищем внутри отобранного.
#
# Конфигурация рассчитана на один узел: хранение на локальном диске,
# кольцо в памяти, реплик нет. Для стенда из трёх машин этого достаточно,
# для распределённой установки понадобилось бы внешнее объектное хранилище.

auth_enabled: false

server:
  http_listen_port: 3100

common:
  instance_addr: 127.0.0.1
  path_prefix: /loki
  storage:
    filesystem:
      chunks_directory: /loki/chunks
      rules_directory: /loki/rules
  replication_factor: 1
  ring:
    kvstore:
      store: inmemory

schema_config:
  configs:
    - from: 2020-10-24
      store: tsdb
      object_store: filesystem
      schema: v13
      index:
        prefix: index_
        period: 24h