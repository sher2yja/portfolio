# Обратный прокси перед приложением: одна точка входа вместо публикации
# портов каждого микросервиса по отдельности.
#
# Директива resolver обязательна и указывает на встроенный DNS Docker
# (127.0.0.11). Без неё nginx резолвит имена сервисов один раз при старте
# и запоминает адреса навсегда. В Docker адрес контейнера меняется при
# каждом пересоздании, поэтому после перезапуска любого сервиса прокси
# продолжал бы стучаться по старому адресу. Параметр valid=10s задаёт,
# как долго держать запись в кеше.
#
# Два порта, а не location'ы на одном: session-service и gateway-service
# ожидают запросы по корневым путям, и разведение по путям потребовало бы
# переписывать адреса в их ответах.

events {
    worker_connections 1024;
}

http {
    resolver 127.0.0.11 valid=10s;

    server {
        listen 8081;
        location / {
            # Используем короткое имя сервиса (без префикса hotelapp_)
            proxy_pass http://session-service:8081;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_connect_timeout 10s;
            proxy_read_timeout 30s;
        }
    }

    server {
        listen 8087;
        location / {
            # Используем короткое имя сервиса (без префикса hotelapp_)
            proxy_pass http://gateway-service:8087;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_connect_timeout 10s;
            proxy_read_timeout 30s;
        }
    }
}
