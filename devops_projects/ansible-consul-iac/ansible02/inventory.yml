# Инвентарь части 2 в формате YAML, а не INI как в части 1.
#
# Формат выбран из-за вложенности: здесь у групп появляются переменные
# и хостов больше, а YAML читается лучше, когда структура перестаёт быть
# плоским списком. Функционально форматы равнозначны.
#
# Имя хоста consul_server записано через подчёркивание, а не через дефис:
# в site.yml оно используется как имя группы в hosts, а дефис Ansible
# в таком контексте разбирает неоднозначно.

all:
  vars:
    ansible_user: vagrant
    ansible_ssh_private_key_file: ~/.ssh/id_ed25519
  hosts:
    manager:
      ansible_host: 192.168.56.19
    consul_server:
      ansible_host: 192.168.56.20
    api:
      ansible_host: 192.168.56.21
    db:
      ansible_host: 192.168.56.22