# ВНИМАНИЕ: значения — учебные заглушки локального стенда, не рабочие секреты.
#
# postgres/postgres и guest/guest — пароли по умолчанию, за пределы minikube
# не ведут. Хранить так секреты в настоящем проекте нельзя: они лежат в
# открытом виде в git, а base64 в Secret — кодирование, а не шифрование.
# В рабочем проекте здесь были бы Sealed Secrets, External Secrets Operator
# или Vault, а сам файл в репозиторий не попадал бы.
#
# stringData вместо data — Kubernetes сам закодирует значения в base64,
# в манифесте они остаются читаемыми. Проверить, что доехало правильно:
#   kubectl get secret svc-secrets -n basic-kuber \
#     -o jsonpath='{.data.POSTGRES_USER}' | base64 --decode; echo
#
# Пара RSA-ключей для подписи JWT в репозиторий не выкладывается. Перед
# запуском стенда подставить свою — команды генерации в нужном формате
# (base64 от DER, без PEM-заголовков):
#
#   openssl genpkey -algorithm RSA -pkeyopt rsa_keygen_bits:2048 -out jwt.pem
#   openssl pkcs8 -topk8 -nocrypt -in jwt.pem -outform DER | base64 -w0   # приватный
#   openssl rsa -in jwt.pem -pubout -outform DER | base64 -w0             # публичный
apiVersion: v1
kind: Secret
metadata:
  name: svc-secrets
  namespace: basic-kuber
type: Opaque
stringData:
  POSTGRES_USER: "postgres"
  POSTGRES_PASSWORD: "postgres"
  RABBIT_MQ_USER: "guest"
  RABBIT_MQ_PASSWORD: "guest"
  privateKey: "<приватный ключ: base64 от DER, см. шапку файла>"
  publicKey: "<публичный ключ: base64 от DER, см. шапку файла>"
