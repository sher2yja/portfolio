# Девять Deployment: база, брокер и семь микросервисов.
#
# Реплика у всех одна — требование задания.
#
# Закомментированный блок strategy: Recreate оставлен намеренно. Задание требует
# замерить время переразвёртывания обеими стратегиями, и переключение между ними
# сводится к тому, какой из двух блоков раскомментирован. Замеры — в main_report.md.
#
# Разница по существу: Recreate гасит все старые поды и только потом поднимает
# новые (простой есть, но версии не пересекаются), RollingUpdate заменяет поды
# по одному (простоя нет, но какое-то время в кластере работают обе версии).
#
# Микросервисы получают переменные окружения целиком через envFrom — из ConfigMap
# environments и Secret svc-secrets. Поверх этого каждый отдельно доопределяет
# POSTGRES_DB через configMapKeyRef: имя базы у каждого своё.
#
# gateway-svc — единственный без POSTGRES_DB и без secretRef: своей базы у него
# нет, он только маршрутизирует запросы на остальные сервисы.
#
# Тег образов :03 зафиксирован под это задание. В соседних проектах серии теги
# другие — каждый отчёт описан на своей версии, подтягивать к одному значению
# не нужно.

# db
apiVersion: apps/v1
kind: Deployment
metadata:
  name: database
  namespace: basic-kuber
spec:
  replicas: 1
  # strategy:
  #   type: Recreate
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 1
      maxSurge: 1
  selector:
    matchLabels:
      svc: db
  template:
    metadata:
      labels:
        svc: db
    spec:
      containers:
      - name: postgres
        image: postgres:15.1-alpine
        ports:
        - containerPort: 5432
        volumeMounts: # Примонтировали виртуальный диск virtual-db-disk внутрь контейнера в папку /docker-entrypoint-initdb.d/
        - name: virtual-db-disk
          mountPath: /docker-entrypoint-initdb.d/
        envFrom:
        - secretRef:
            name: svc-secrets
      volumes: # Создали виртуальный диск на машине с названием virtual-db-disk и содержимым из конфигмапа database-script
      - name: virtual-db-disk
        configMap:
          name: database-script

---

# rabbitmq
apiVersion: apps/v1
kind: Deployment
metadata:
  name: rabbitmq
  namespace: basic-kuber
spec:
  replicas: 1
  # strategy:
  #   type: Recreate
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 1
      maxSurge: 1
  selector:
    matchLabels:
      svc: rabbit
  template:
    metadata:
      labels:
        svc: rabbit
    spec:
      containers:
      - name: rabbitmq
        image: rabbitmq:3-management-alpine
        ports:
        - containerPort: 5672
        - containerPort: 15672
        env: # Перестраховка, чтобы rabbimq принимал подключения под гостем с других подов
        - name: RABBITMQ_ALLOW_REMOTE_GUEST_ACCESS
          value: "true"

---

# session
apiVersion: apps/v1
kind: Deployment
metadata:
  name: session-svc
  namespace: basic-kuber
spec:
  replicas: 1
  # strategy:
  #   type: Recreate
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 1
      maxSurge: 1
  selector:
    matchLabels:
      svc: session
  template:
    metadata:
      labels:
        svc: session
    spec:
      containers:
      - name: session-svc
        image: iskstep93/session-service:03
        ports:
        - containerPort: 8081
        env:
        - name: POSTGRES_DB
          valueFrom:
            configMapKeyRef:
              name: environments
              key: POSTGRES_DB_SESSION
        envFrom:
        - configMapRef:
            name: environments
        - secretRef:
            name: svc-secrets

