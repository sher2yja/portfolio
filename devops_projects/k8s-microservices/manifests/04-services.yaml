# Девять Service: точки доступа к подам по стабильным именам.
#
# Service связывается с подами по метке svc: <имя> — она проставляется в
# 05-deployments.yaml. Имена Service и Deployment намеренно разные
# (session-service против session-svc): первое — DNS-имя для обращений,
# второе — имя контроллера развёртывания.
#
# type: NodePort стоит только у session-service и gateway-service — только к ним
# нужен доступ снаружи кластера, для функциональных тестов. Остальные семь
# остаются ClusterIP: они вызываются изнутри и наружу не публикуются.
#
# У rabbitmq два порта: 5672 для сообщений и 15672 для веб-интерфейса,
# поэтому порты именованные — Kubernetes требует имён, когда портов больше одного.

# db
apiVersion: v1
kind: Service
metadata:
  name: db
  namespace: basic-kuber
spec:
  selector:
    svc: db
  ports:
  - protocol: TCP
    port: 5432
    targetPort: 5432

---

# rabbitmq
apiVersion: v1
kind: Service
metadata:
  name: rabbitmq
  namespace: basic-kuber
spec:
  selector:
    svc: rabbit
  ports:
  - name: data-exchange
    protocol: TCP
    port: 5672
    targetPort: 5672
  - name: web 
    protocol: TCP
    port: 15672
    targetPort: 15672

---

# session
apiVersion: v1
kind: Service
metadata:
  name: session-service
  namespace: basic-kuber
spec:
  type: NodePort
  selector:
    svc: session
  ports:
  - protocol: TCP
    port: 8081
    targetPort: 8081

---

