# Namespace для всего приложения.
#
# Цифры в начале имён файлов задают порядок применения: kubectl apply -f ./manifests/
# обходит каталог в алфавитном порядке, а namespace должен существовать раньше
# объектов, которые в нём создаются. Переименовывать файлы нельзя.

apiVersion: v1
kind: Namespace
metadata:
  name: basic-kuber
